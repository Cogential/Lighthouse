plugins {
    id 'com.android.application'
}

// Game data that ships inside the APK and is unpacked to the app's files dir on first run.
// Populate with scripts/stage-assets.sh (lighthouse.o2r, config.yml, assets/, gamecontrollerdb.txt).
def gameDataDir = file("$rootDir/game-data")

// Release signing key, kept outside the repo. Override the location with
// -PlighthouseSigningProperties=/path/to/file. Without it, release builds use the debug key.
def expandHome = { String path -> path.startsWith('~/') ? System.getProperty('user.home') + path.substring(1) : path }
def signingOverride = project.findProperty('lighthouseSigningProperties')
File signingPropsFile
if (signingOverride) {
    // Relative paths are relative to the android/ directory (the Gradle root), not to this module.
    signingPropsFile = new File(expandHome(signingOverride.toString()))
    if (!signingPropsFile.absolute) {
        signingPropsFile = new File(rootProject.projectDir, signingPropsFile.path)
    }
    if (!signingPropsFile.isFile()) {
        throw new GradleException("lighthouseSigningProperties points to ${signingPropsFile}, which doesn't exist")
    }
} else {
    signingPropsFile = new File("${System.getProperty('user.home')}/.android-keys/lighthouse-release.properties")
    if (!signingPropsFile.isFile()) {
        signingPropsFile = null
        logger.info('No release signing properties found; release builds use the debug key')
    }
}

def releaseSigning = null
if (signingPropsFile != null) {
    def props = new Properties()
    signingPropsFile.withInputStream { props.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !props[it] }
    if (!missing.isEmpty()) {
        throw new GradleException("${signingPropsFile} is missing: ${missing.join(', ')}")
    }
    // A relative keystore path is relative to the properties file.
    def keystore = new File(expandHome(props['storeFile']))
    if (!keystore.absolute) {
        keystore = new File(signingPropsFile.parentFile, keystore.path)
    }
    if (!keystore.isFile()) {
        throw new GradleException("Keystore ${keystore} (from ${signingPropsFile}) doesn't exist")
    }
    releaseSigning = [storeFile: keystore, storePassword: props['storePassword'], keyAlias: props['keyAlias'],
                      keyPassword: props['keyPassword']]
}

android {
    namespace 'com.cogent.lighthouse'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.cogent.lighthouse'
        minSdk 26
        targetSdk 35
        versionCode 110
        versionName '1.1.0'

        ndk {
            // Override for emulator testing: ./gradlew assembleRelease -Pabis=x86_64
            abiFilters(*(project.findProperty('abis') ?: 'arm64-v8a').split(','))
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
                targets 'Lighthouse'
            }
        }
    }

    signingConfigs {
        release {
            if (releaseSigning != null) {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseSigning != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [gameDataDir]
        }
    }

    androidResources {
        // .o2r is already a zip; storing it avoids a slow recompress and allows streaming copy
        noCompress 'o2r'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
